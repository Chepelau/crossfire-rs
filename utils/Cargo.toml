[package]
name = "crossfire-utils"
version = "0.1.1"
description = "Utilities used by crossfire"
repository = "https://github.com/frostyplanet/crossfire-rs"
categories = ["concurrency", "data-structures"]
edition = "2021"
license = "Apache-2.0"
readme = "../README.md"

[dependencies]

[features]
default=["std"]
padding=[]
std=[]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
# enable features in the documentation
rustdoc-args = ["--cfg", "docsrs"]
